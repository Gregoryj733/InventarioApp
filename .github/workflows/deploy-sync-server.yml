name: Deploy Sync Server

on:
  push:
    branches: [main]
    paths:
      - "sync-server/**"
      - ".github/workflows/deploy-sync-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # El servicio en Render (ver render.yaml, runtime: docker) construye su
      # propia imagen directamente desde el Dockerfile del repo en cada push,
      # así que aquí solo se fuerza el redeploy por API como respaldo (por si
      # "autodeploy" quedara deshabilitado en el dashboard). No se debe pasar
      # "imageUrl": ese parámetro es solo para servicios "image-backed" y
      # provoca un 400 en un servicio "runtime: docker" como este (causa de
      # que todos los deploys automáticos fallaran silenciosamente).
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          response=$(curl -fsS -X POST "https://api.render.com/v1/services/srv-d9o2qejncjis73b4p700/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          echo "$response"
          deploy_id=$(echo "$response" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Deploy id: $deploy_id"
          for i in $(seq 1 60); do
            status=$(curl -fsS "https://api.render.com/v1/services/srv-d9o2qejncjis73b4p700/deploys/${deploy_id}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))")
            echo "Render deploy status: $status (check $i/60)"
            if [ "$status" = "live" ]; then
              echo "Deploy succeeded."
              exit 0
            fi
            if [ "$status" = "build_failed" ] || [ "$status" = "update_failed" ] || [ "$status" = "canceled" ]; then
              echo "Deploy failed with status: $status"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for Render deploy."
          exit 1
