name: Deploy Sync Server

on:
  push:
    branches: [main]
    paths:
      - "sync-server/**"
      - "render.yaml"
      - ".github/workflows/deploy-sync-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (all inventario-sync services)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::warning::RENDER_API_KEY no configurado; Render Auto-Deploy del repo sigue activo."
            exit 0
          fi

          list_code=$(curl -sS -o /tmp/render-services.json -w "%{http_code}" \
            "https://api.render.com/v1/services?limit=100" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" || true)
          echo "List services HTTP ${list_code}"
          if [ "${list_code}" = "401" ] || [ "${list_code}" = "403" ]; then
            echo "::warning::RENDER_API_KEY inválida o sin permisos (HTTP ${list_code}). Actualiza el secret en GitHub; Render Auto-Deploy del repo sigue activo."
            exit 0
          fi
          if ! [[ "${list_code}" =~ ^2 ]]; then
            echo "::warning::No se pudo listar servicios en Render (HTTP ${list_code}). Render Auto-Deploy del repo sigue activo."
            exit 0
          fi

          python3 <<'PY'
          import json
          wanted = {"inventario-sync-totalcare", "inventario-sync-supra-parts"}
          data = json.load(open("/tmp/render-services.json"))
          found = []
          for item in data:
              svc = item.get("service") or {}
              name = svc.get("name")
              if name in wanted:
                  found.append((name, svc.get("id")))
          if not found:
              print("::warning::No se encontraron servicios inventario-sync en Render. Sincroniza render.yaml en Blueprints.")
          json.dump(found, open("/tmp/render-targets.json", "w"))
          for name, sid in found:
              print(f"Target: {name} ({sid})")
          PY

          if [ ! -s /tmp/render-targets.json ] || [ "$(python3 -c 'import json; print(len(json.load(open("/tmp/render-targets.json"))))')" = "0" ]; then
            exit 0
          fi

          python3 <<'PY'
          import json, os, subprocess, time, sys
          api_key = os.environ["RENDER_API_KEY"]
          targets = json.load(open("/tmp/render-targets.json"))
          failed = False
          auth_failed = False
          for name, sid in targets:
              print(f"Deploying {name}...")
              proc = subprocess.run([
                  "curl", "-sS", "-o", "/tmp/render-deploy.json", "-w", "%{http_code}",
                  "-X", "POST", f"https://api.render.com/v1/services/{sid}/deploys",
                  "-H", f"Authorization: Bearer {api_key}",
                  "-H", "Content-Type: application/json",
                  "-d", '{"clearCache":"do_not_clear"}'
              ], capture_output=True, text=True)
              code = proc.stdout.strip()
              print(f"HTTP {code}")
              if proc.stderr:
                  print(proc.stderr)
              if code in ("401", "403"):
                  print(f"::warning::RENDER_API_KEY sin permisos para {name} (HTTP {code})")
                  auth_failed = True
                  continue
              if not code.startswith("2"):
                  print(f"::warning::Deploy API falló para {name} (HTTP {code})")
                  failed = True
                  continue
              deploy_id = json.load(open("/tmp/render-deploy.json"))["id"]
              for i in range(1, 41):
                  status_proc = subprocess.run([
                      "curl", "-sS", "-o", "/tmp/render-deploy-status.json", "-w", "%{http_code}",
                      f"https://api.render.com/v1/services/{sid}/deploys/{deploy_id}",
                      "-H", f"Authorization: Bearer {api_key}"
                  ], capture_output=True, text=True)
                  status_code = status_proc.stdout.strip()
                  if status_code in ("401", "403"):
                      print(f"::warning::No se pudo consultar estado de {name} (HTTP {status_code})")
                      auth_failed = True
                      break
                  if not status_code.startswith("2"):
                      print(f"::warning::Estado de deploy desconocido para {name} (HTTP {status_code})")
                      break
                  status = json.load(open("/tmp/render-deploy-status.json")).get("status", "unknown")
                  print(f"  {name}: {status} ({i}/40)")
                  if status == "live":
                      break
                  if status in ("build_failed", "update_failed", "canceled"):
                      print(f"::warning::{name} deploy {status}")
                      failed = True
                      break
                  time.sleep(15)
          if auth_failed:
              print("::warning::Actualiza RENDER_API_KEY en GitHub Secrets para habilitar deploy vía API.")
          sys.exit(1 if failed and not auth_failed else 0)
          PY

      - name: Verify Sucursal A health
        run: |
          for i in $(seq 1 12); do
            body=$(curl -fsS "https://inventario-sync-totalcare.onrender.com/health" || true)
            echo "$body"
            echo "$body" | grep -q '"ok":true' && exit 0
            sleep 15
          done
          echo "::warning::Sucursal A /health no respondió OK."

      - name: Verify Sucursal B health (optional)
        run: |
          code=$(curl -sS -o /tmp/health-b.json -w "%{http_code}" "https://inventario-sync-supra-parts.onrender.com/health" || true)
          echo "HTTP $code"
          cat /tmp/health-b.json || true
          if [ "$code" = "404" ]; then
            echo "::warning::Supra Parts aún no existe. En Render: Blueprints -> Sync para crear inventario-sync-supra-parts."
          fi
